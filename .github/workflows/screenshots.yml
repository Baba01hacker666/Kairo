name: Auto Screenshots

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
        
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        
    - name: Install Dependencies
      run: npm ci || npm install
      
    - name: Install Playwright Chromium & System Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y libasound2t64 libgbm1 libnspr4 libnss3 || true
        npx playwright install chromium
      
    - name: Build Project
      run: npm run build
      
    - name: Start Preview Server
      run: |
        npx vite preview --port 4173 &
        sleep 5
        
    - name: Take Screenshots
      run: node scripts/take_screenshots.js

    - name: Upload Screenshots as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kairo-automated-screenshots
        path: screenshots/
        retention-days: 30
