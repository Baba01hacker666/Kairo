name: Record The Arrival Cinematic

on:
  workflow_dispatch:
  push:
    paths:
      - 'examples/the-arrival/**'

jobs:
  record:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '22.x'

    - name: Install dependencies
      run: npm ci

    - name: Install system libs & Playwright Chromium
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y libasound2t64 libgbm1 libnspr4 libnss3 xvfb ffmpeg
        npx playwright install chromium

    - name: Build
      run: npm run build

    - name: Start preview server
      run: |
        npx vite preview --port 4173 &
        sleep 4

    - name: Record cinematic (65 s)
      run: |
        node -e "
        import('playwright').then(async ({ chromium }) => {
          const fs = await import('fs');
          const browser = await chromium.launch({
            headless: true,
            args: ['--use-gl=swiftshader','--no-sandbox','--disable-setuid-sandbox',
                   '--ignore-gpu-blocklist','--disable-dev-shm-usage']
          });
          const ctx = await browser.newContext({
            viewport: { width: 1280, height: 720 },
            recordVideo: { dir: 'video_out', size: { width: 1280, height: 720 } }
          });
          const page = await ctx.newPage();
          page.on('console', m => console.log('[browser]', m.text()));
          page.on('pageerror', e => console.error('[browser ERR]', e.message));
          await page.goto('http://localhost:4173/examples/the-arrival/index.html', { waitUntil: 'networkidle', timeout: 30000 });
          console.log('Recording 65 seconds...');
          await page.waitForTimeout(65000);
          await page.screenshot({ path: 'arrival-frame.png' });
          const vid = page.video();
          await ctx.close();
          await browser.close();
          const src = await vid.path();
          fs.copyFileSync(src, 'the-arrival.webm');
          console.log('Done! Video:', 'the-arrival.webm');
        });
        "

    - name: Upload video artifact
      uses: actions/upload-artifact@v4
      with:
        name: the-arrival-recording
        path: |
          the-arrival.webm
          arrival-frame.png
        retention-days: 14

    - name: Upload frame screenshot
      uses: actions/upload-artifact@v4
      with:
        name: the-arrival-frame
        path: arrival-frame.png
        retention-days: 14
