name: Kairo Engine Build, Test & QA Video Artifacts

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-test-and-artifact:
    name: Build Engine, Run QA & Upload Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Run TypeScript Linter & Type Check
        run: npm run lint

      - name: Run Automated Engine Unit Tests
        run: npm test

      - name: Build Production Distribution Bundle (dist/)
        run: npm run build

      - name: Upload Production Web Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kairo-engine-dist-bundle
          path: dist/
          retention-days: 14

      - name: Upload Recorded QA Media & Test Reports Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kairo-qa-test-recordings
          path: |
            *.webm
            *.png
            *.mp4
            dist/examples/fox-game/
          if-no-files-found: ignore
          retention-days: 30
