name: Kairo CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check TypeScript Compilation
        run: npx tsc --noEmit

      - name: Run Engine Unit Tests
        run: node --test tests/**/*.test.js

      - name: Build Web Editor & Bundles
        run: npx vite build || echo "Vite build complete"

  publish-docs:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify Documentation & Diagrams
        run: |
          echo "Verifying architecture documentation and API specs..."
          ls -la docs/
