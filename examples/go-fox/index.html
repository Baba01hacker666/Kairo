<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hybrid Go/Three.js Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #87ceeb; /* Sky blue */
      font-family: 'Inter', sans-serif;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      pointer-events: none;
    }
    h1 { margin: 0 0 10px 0; font-size: 24px; }
    p { margin: 5px 0; font-size: 16px; }
    
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 24px;
      background: rgba(0,0,0,0.7);
      padding: 20px;
      border-radius: 10px;
    }

    .controls-hint {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: white;
      background: rgba(0,0,0,0.5);
      padding: 15px;
      border-radius: 8px;
      backdrop-filter: blur(5px);
    }
    
    /* Mobile Controls */
    #joystick-zone {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.5);
      touch-action: none;
      display: none;
    }
    #joystick-knob {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    #sprint-btn {
      position: absolute;
      bottom: 30px;
      right: 30px;
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      color: white;
      font-weight: bold;
      font-size: 16px;
      touch-action: none;
      display: none;
      user-select: none;
    }
    #sprint-btn:active {
      background: rgba(255, 255, 255, 0.6);
    }
    
    @media (hover: none) and (pointer: coarse) {
      .controls-hint { display: none; }
      #joystick-zone { display: block; }
      #sprint-btn { display: flex; align-items: center; justify-content: center; }
    }
  </style>
  <script type="module" src="../../wasm/wasm_exec.js"></script>
  <script type="module" crossorigin src="../../assets/gofox-C0PjXdiM.js"></script>
  <link rel="modulepreload" crossorigin href="../../assets/modulepreload-polyfill-Dezn_h7o.js">
  <link rel="modulepreload" crossorigin href="../../assets/three-CQG_59fc.js">
</head>
<body>
  <div id="loading">Loading WASM Physics Engine...</div>

  <div id="ui" style="display:none;">
    <h1>Go + Three.js Fox</h1>
    <p>Physics via Go (WASM), Rendering via Three.js</p>
    <p>Score: <span id="score">0</span></p>
  </div>
  
  <div class="controls-hint">
    <strong>Controls:</strong><br>
    [W, A, S, D] to Move<br>
    [SHIFT] to Run<br>
    [Mouse] to Rotate Camera
  </div>
  
  <div id="joystick-zone">
    <div id="joystick-knob"></div>
  </div>
  <div id="sprint-btn">RUN</div>

</body>
</html>
