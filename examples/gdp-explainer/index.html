<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GDP Explainer Video</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; }
    #kairo-canvas { width: 100%; height: 100%; display: block; }
    
    #ui-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-family: sans-serif;
      z-index: 100;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div id="ui-overlay">
    <button id="btn-start">Record Explainer Video</button>
  </div>
  <canvas id="kairo-canvas"></canvas>
  <script type="module" src="./main.ts"></script>
</body>
</html>
