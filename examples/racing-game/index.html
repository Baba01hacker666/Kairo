<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kairo Engine - Mobile Racing Game Prototype</title>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }

    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      box-sizing: border-box;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      color: white;
      text-shadow: 1px 1px 2px black;
      font-size: 24px;
      font-weight: bold;
    }

    #speedometer {
      font-size: 32px;
      color: #00ffcc;
    }

    .mobile-controls {
      display: flex;
      justify-content: space-between;
      width: 100%;
      pointer-events: auto;
    }

    .control-btn {
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      user-select: none;
      touch-action: none;
    }

    .control-btn:active {
      background: rgba(255, 255, 255, 0.5);
    }

    #controls-left { display: flex; gap: 10px; }
    #controls-right { display: flex; gap: 10px; }

    @media (min-width: 768px) {
      .mobile-controls { display: none; }
    }
  </style>
  <script type="module" crossorigin src="../../assets/racing-CqK2psEf.js"></script>
  <link rel="modulepreload" crossorigin href="../../assets/modulepreload-polyfill-Dezn_h7o.js">
  <link rel="modulepreload" crossorigin href="../../assets/three-B8-o-d__.js">
  <link rel="modulepreload" crossorigin href="../../assets/rolldown-runtime-CEoa-xHZ.js">
  <link rel="modulepreload" crossorigin href="../../assets/vendor-CiG8lhUG.js">
  <link rel="modulepreload" crossorigin href="../../assets/src-7SuFZu5r.js">
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="ui">
    <div class="top-bar">
      <div>Lap: 1/3</div>
      <div id="speedometer">0 km/h</div>
      <div>Pos: 1/1</div>
    </div>

    <div class="mobile-controls">
      <div id="controls-left">
        <div class="control-btn" id="btn-left">◀</div>
        <div class="control-btn" id="btn-right">▶</div>
      </div>
      <div id="controls-right">
        <div class="control-btn" id="btn-brake">Brake</div>
        <div class="control-btn" id="btn-gas">Gas</div>
      </div>
    </div>
  </div>

</body>
</html>
