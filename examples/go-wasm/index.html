<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golang WASM 3D Renderer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #09090b;
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
        .overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 24px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            margin: 0;
            color: #a1a1aa;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <h1>Go WASM Renderer</h1>
        <p>Pure software 3D rendering computed in WebAssembly</p>
    </div>
    <canvas id="canvas"></canvas>

    <script src="./wasm_exec.js"></script>
    <script>
        const go = new Go();
        fetch("main.wasm")
            .then(response => response.arrayBuffer())
            .then(bytes => WebAssembly.instantiate(bytes, go.importObject))
            .then(result => go.run(result.instance))
            .catch(err => console.error("Failed to load WASM engine:", err));
    </script>
</body>
</html>
