<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kairo Engine - Interactive CDN Playground & Documentation</title>
  <style>
    :root {
      --bg-dark: #0a0c10;
      --panel-bg: rgba(18, 22, 30, 0.85);
      --accent: #4f46e5;
      --accent-glow: #6366f1;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.1);
      --font-mono: 'Fira Code', 'Cascadia Code', Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar Navigation */
    #sidebar {
      width: 320px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 15px;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
    }

    .brand span {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: -10px;
      margin-bottom: 10px;
    }

    .nav-header {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-top: 10px;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 12px 14px;
      border-radius: 8px;
      text-align: left;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-btn:hover {
      background: rgba(99, 102, 241, 0.15);
      border-color: var(--accent);
      color: #fff;
    }

    .nav-btn.active {
      background: var(--accent);
      border-color: var(--accent-glow);
      color: #fff;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }

    /* Code Editor & Viewport Main Area */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    #toolbar {
      height: 50px;
      background: rgba(15, 18, 25, 0.9);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .cdn-badge {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .action-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .action-btn:hover {
      background: var(--accent-glow);
    }

    #workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Editor Side */
    #editor-container {
      width: 50%;
      background: #0f1219;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    textarea#code-input {
      flex: 1;
      background: transparent;
      color: #e5e7eb;
      font-family: var(--font-mono);
      font-size: 0.875rem;
      line-height: 1.5;
      padding: 20px;
      border: none;
      outline: none;
      resize: none;
      tab-size: 2;
    }

    /* 3D Viewport Side */
    #viewport-container {
      width: 50%;
      position: relative;
      background: #000;
    }

    iframe#preview-frame {
      width: 100%;
      height: 100%;
      border: none;
    }

    #status-overlay {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      border: 1px solid var(--border);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Sidebar Nav -->
  <div id="sidebar">
    <div class="brand">
      🚀 <span>Kairo Engine</span>
    </div>
    <div class="subtitle">Interactive CDN Playground</div>

    <div class="nav-header">Live CDN Demos</div>
    <button class="nav-btn active" onclick="loadSnippet('basic')">🎮 1. Basic 3D Scene</button>
    <button class="nav-btn" onclick="loadSnippet('shared-context')">⚡ 2. Shared Entity Context</button>
    <button class="nav-btn" onclick="loadSnippet('physics')">🎲 3. 3D RigidBody Physics</button>
    <button class="nav-btn" onclick="loadSnippet('terrain')">🌲 4. Procedural Terrain & Grass</button>
    <button class="nav-btn" onclick="loadSnippet('ai')">🤖 5. AI Pathfinding Grid</button>
    <button class="nav-btn" onclick="loadSnippet('shader')">🌊 6. Custom Shaders</button>

    <div style="margin-top: auto; font-size: 0.75rem; color: var(--text-muted); line-height: 1.4;">
      Powered by <strong>@kairo/core</strong> served live via global CDN!
    </div>
  </div>

  <!-- Main Container -->
  <div id="main">
    <div id="toolbar">
      <div class="cdn-badge">
        ● CDN Active: jsDelivr / GitHub Pages
      </div>
      <div>
        <button class="action-btn" onclick="runCode()">▶ Run Live Code</button>
      </div>
    </div>

    <div id="workspace">
      <!-- Editor -->
      <div id="editor-container">
        <textarea id="code-input" spellcheck="false"></textarea>
      </div>

      <!-- Live 3D Viewport -->
      <div id="viewport-container">
        <iframe id="preview-frame"></iframe>
        <div id="status-overlay">FPS: 60 | Status: Ready</div>
      </div>
    </div>
  </div>

  <script>
    const snippets = {
      basic: `// Load Kairo Engine directly from global CDN
import { KairoApp } from 'https://cdn.jsdelivr.net/gh/Baba01hacker666/Kairo@gh-pages/lib/kairo.mjs';

const app = new KairoApp({
  canvas: '#game-canvas',
  background: 0x0a0c10
});

// Create 3D Spinning Cube
const cube = app.world.createEntity('spinning_cube');
cube.addTransform({ position: [0, 1, 0] });
cube.addMesh({ type: 'box', color: 0x6366f1, size: [1.5, 1.5, 1.5] });

// Rotate cube each frame
app.onUpdate((dt) => {
  const transform = cube.getTransform();
  transform.rotation.y += dt * 1.5;
  transform.rotation.x += dt * 0.5;
});

app.start();`,

      'shared-context': `// Shared Entity Context Archetype Optimization
import { KairoApp } from 'https://cdn.jsdelivr.net/gh/Baba01hacker666/Kairo@gh-pages/lib/kairo.mjs';

const app = new KairoApp({ canvas: '#game-canvas' });

// Create 1 Shared Context Record for Bouncing Balls
const ballCtx = app.world.createSharedContext('bouncing_ball', {
  radius: 0.4,
  restitution: 0.85,
  color: 0x10b981
});

// Instantiate 500 entities sharing 1 archetype record
for (let i = 0; i < 500; i++) {
  const ball = app.world.createEntityWithSharedContext('bouncing_ball');
  ball.addTransform({
    position: [(Math.random() - 0.5) * 20, Math.random() * 10 + 1, (Math.random() - 0.5) * 20]
  });
  ball.addMesh({ type: 'sphere', radius: 0.4, color: 0x10b981 });
}

app.start();`,

      physics: `// 3D RigidBody & Collision Physics
import { KairoApp } from 'https://cdn.jsdelivr.net/gh/Baba01hacker666/Kairo@gh-pages/lib/kairo.mjs';

const app = new KairoApp({ canvas: '#game-canvas' });

// Floor RigidBody
const floor = app.world.createEntity('floor');
floor.addTransform({ position: [0, 0, 0] });
floor.addMesh({ type: 'plane', size: [20, 20], color: 0x1f2937 });
floor.addRigidBody({ mass: 0 }); // Static

// Drop Physics Spheres
for (let i = 0; i < 30; i++) {
  const sphere = app.world.createEntity('sphere_' + i);
  sphere.addTransform({ position: [(Math.random() - 0.5) * 4, 5 + i * 1.2, (Math.random() - 0.5) * 4] });
  sphere.addMesh({ type: 'sphere', radius: 0.5, color: 0xf59e0b });
  sphere.addRigidBody({ mass: 1, useGravity: true });
}

app.start();`,

      terrain: `// Procedural Heightmap Terrain & Instanced Grass Field
import { KairoApp } from 'https://cdn.jsdelivr.net/gh/Baba01hacker666/Kairo@gh-pages/lib/kairo.mjs';

const app = new KairoApp({ canvas: '#game-canvas' });

// Generate Procedural Terrain
const terrain = app.world.createProceduralTerrain({
  width: 40,
  depth: 40,
  heightScale: 4.0,
  seed: 42
});

app.start();`,

      ai: `// AI Pathfinding Grid Solver
import { KairoApp, NavGrid } from 'https://cdn.jsdelivr.net/gh/Baba01hacker666/Kairo@gh-pages/lib/kairo.mjs';

const app = new KairoApp({ canvas: '#game-canvas' });
const navGrid = new NavGrid(10, 10);

// Solve A* Path from (0,0) to (9,9)
const path = navGrid.findPath({ x: 0, z: 0 }, { x: 9, z: 9 });
console.log('Calculated A* Path:', path);

app.start();`,

      shader: `// Custom Water Shader Preset
import { KairoApp, CustomShaderMaterial } from 'https://cdn.jsdelivr.net/gh/Baba01hacker666/Kairo@gh-pages/lib/kairo.mjs';

const app = new KairoApp({ canvas: '#game-canvas' });

const waterPlane = app.world.createEntity('water');
waterPlane.addTransform({ position: [0, 0, 0] });
waterPlane.addMesh({ type: 'plane', size: [15, 15], shader: 'water' });

app.start();`
    };

    function loadSnippet(key) {
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('code-input').value = snippets[key] || snippets.basic;
      runCode();
    }

    function runCode() {
      const userCode = document.getElementById('code-input').value;
      const iframe = document.getElementById('preview-frame');
      
      const htmlContent = `
<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; overflow: hidden; background: #0a0c10; }
    canvas { width: 100vw; height: 100vh; display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.js",
      "three/examples/jsm/postprocessing/EffectComposer.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js",
      "three/examples/jsm/postprocessing/RenderPass.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/RenderPass.js",
      "three/examples/jsm/postprocessing/ShaderPass.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/ShaderPass.js",
      "three/examples/jsm/postprocessing/UnrealBloomPass.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js",
      "three/examples/jsm/postprocessing/FilmPass.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/FilmPass.js",
      "three/examples/jsm/postprocessing/OutputPass.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/OutputPass.js",
      "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
    }
  }
  <\/script>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <script type="module">
    try {
      ${userCode}
    } catch (err) {
      console.error('Runtime Error:', err);
    }
  <\/script>
</body>
</html>`;

      iframe.srcdoc = htmlContent;
    }

    // Load initial snippet
    document.getElementById('code-input').value = snippets.basic;
    runCode();
  </script>
</body>
</html>
