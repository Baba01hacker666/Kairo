<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>2.5D Platformer // Kairo Engine</title>
  <style>
    :root {
      --primary: #38bdf8;
      --secondary: #a855f7;
      --bg: #0f172a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    canvas { display: block; width: 100vw; height: 100vh; }

    /* UI Overlay */
    #ui-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    .header {
      text-align: center;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    
    .header h1 {
      font-size: 24px;
      letter-spacing: 2px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .controls-hint {
      font-size: 14px;
      color: #94a3b8;
      margin-top: 5px;
    }

    /* Mobile Controls */
    #mobile-controls {
      display: none;
      width: 100%;
      pointer-events: auto;
      justify-content: space-between;
      align-items: flex-end;
      padding: 10px;
    }

    @media (pointer: coarse), (max-width: 768px) {
      #mobile-controls {
        display: flex;
      }
      .controls-hint {
        display: none;
      }
    }

    .dpad {
      display: flex;
      gap: 15px;
    }

    .btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      color: rgba(255, 255, 255, 0.7);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: all 0.1s;
    }

    .btn:active {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(0.95);
    }

    #btn-jump {
      width: 80px;
      height: 80px;
      border-color: var(--primary);
      color: var(--primary);
      background: rgba(56, 189, 248, 0.1);
    }
    #btn-jump:active {
      background: rgba(56, 189, 248, 0.3);
    }
    
    #btn-spawn {
      position: absolute;
      top: 20px;
      right: 20px;
      width: auto;
      height: auto;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      pointer-events: auto;
      border-color: var(--secondary);
      color: var(--secondary);
      background: rgba(168, 85, 247, 0.1);
    }

  </style>
  <script type="module" crossorigin src="../../assets/platformer25d-BiNfOdA6.js"></script>
  <link rel="modulepreload" crossorigin href="../../assets/modulepreload-polyfill-Dezn_h7o.js">
  <link rel="modulepreload" crossorigin href="../../assets/rolldown-runtime-aKtaBQYM.js">
  <link rel="modulepreload" crossorigin href="../../assets/three-xidUv4B3.js">
  <link rel="modulepreload" crossorigin href="../../assets/FastSoAWorld-CP3clNq0.js">
  <link rel="modulepreload" crossorigin href="../../assets/vendor-BMZqWkbJ.js">
  <link rel="modulepreload" crossorigin href="../../assets/src-D_j9lXBx.js">
</head>
<body>
  <canvas id="game-canvas"></canvas>
  
  <div id="ui-layer">
    <div class="header">
      <h1>2.5D PLATFORMER</h1>
      <div class="controls-hint">A/D to Move | SPACE to Jump | E to drop 3D cubes</div>
    </div>
    
    <div id="btn-spawn" class="btn">Drop 3D Cube</div>

    <div id="mobile-controls">
      <div class="dpad">
        <div id="btn-left" class="btn">◄</div>
        <div id="btn-right" class="btn">►</div>
      </div>
      <div class="action-buttons">
        <div id="btn-jump" class="btn">▲</div>
      </div>
    </div>
  </div>

</body>
</html>
