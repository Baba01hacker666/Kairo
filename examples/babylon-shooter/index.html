    <title>Babylon Shooter Mobile</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000;
        font-family: 'Inter', sans-serif;
        touch-action: none;
      }
      canvas {
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
      }
      #ui {
        position: absolute;
        top: 20px;
        left: 20px;
        color: white;
        pointer-events: none;
        z-index: 10;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      }
      p {
        margin: 5px 0 0 0;
        font-size: 14px;
        opacity: 0.9;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
      }
      #crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 20px;
        height: 20px;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 10;
      }
      #crosshair::before, #crosshair::after {
        content: '';
        position: absolute;
        background: rgba(255, 255, 255, 0.8);
      }
      #crosshair::before {
        top: 50%; left: 0; width: 100%; height: 2px; transform: translateY(-50%);
      }
      #crosshair::after {
        left: 50%; top: 0; height: 100%; width: 2px; transform: translateX(-50%);
      }
      
      #shootBtn {
        position: absolute;
        bottom: 50px;
        right: 50px;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: rgba(255, 50, 50, 0.5);
        border: 2px solid rgba(255, 255, 255, 0.8);
        color: white;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        z-index: 20;
      }
      #shootBtn:active {
        background: rgba(255, 50, 50, 0.8);
      }
