<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kairo Engine - Go WASM Car Game</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; color: white; font-family: sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #ui { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; border: 1px solid #333; backdrop-filter: blur(5px); z-index: 10; }
    h2 { margin: 0 0 10px 0; color: #38bdf8; }
    .speedometer { font-size: 24px; font-weight: bold; color: #facc15; margin-top: 10px; }
    
    /* Mobile Controls */
    #mobile-controls { position: absolute; bottom: 20px; left: 0; width: 100%; height: 120px; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; pointer-events: none; z-index: 10; }
    .dpad, .action-buttons { display: flex; gap: 10px; pointer-events: auto; }
    .btn-mobile { width: 60px; height: 60px; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; color: white; font-size: 24px; display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    .btn-mobile:active { background: rgba(255,255,255,0.5); }
    .dpad { flex-direction: column; justify-content: flex-end; }
    .dpad-row { display: flex; justify-content: center; gap: 10px; }
    .action-buttons { align-items: flex-end; }
    
    @media (min-width: 768px) {
      /* Hide mobile controls on desktop to keep it clean */
      #mobile-controls { display: none; }
    }
  </style>
  <script src="../../wasm_exec.js"></script>
  <!-- Load GSAP for animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script type="module" crossorigin src="../../assets/gocargame-3ioRqfGY.js"></script>
  <link rel="modulepreload" crossorigin href="../../assets/modulepreload-polyfill-Dezn_h7o.js">
  <link rel="modulepreload" crossorigin href="../../assets/rolldown-runtime-aKtaBQYM.js">
  <link rel="modulepreload" crossorigin href="../../assets/three-CQG_59fc.js">
  <link rel="modulepreload" crossorigin href="../../assets/FastSoAWorld-CP3clNq0.js">
  <link rel="modulepreload" crossorigin href="../../assets/vendor-BMZqWkbJ.js">
  <link rel="modulepreload" crossorigin href="../../assets/src-B0fuWHHf.js">
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="ui">
    <h2>Go Physics Car Demo</h2>
    <p>W,A,S,D to Drive</p>
    <p>SPACE to Jump/Boost</p>
    <div class="speedometer" id="speed">0 KM/H</div>
  </div>
  
  <div id="mobile-controls">
    <div class="dpad">
      <div class="dpad-row">
        <div class="btn-mobile" id="btn-up">▲</div>
      </div>
      <div class="dpad-row">
        <div class="btn-mobile" id="btn-left">◀</div>
        <div class="btn-mobile" id="btn-down">▼</div>
        <div class="btn-mobile" id="btn-right">▶</div>
      </div>
    </div>
    <div class="action-buttons">
      <div class="btn-mobile" id="btn-jump" style="width: 80px; height: 80px; font-size: 16px;">JUMP</div>
    </div>
  </div>
  
</body>
</html>
