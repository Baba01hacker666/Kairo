<!DOCTYPE html>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090c15;

      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand h1 {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .back-btn {
      color: #94a3b8;
      text-decoration: none;
      font-size: 13px;
      padding: 6px 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      transition: all 0.2s;
    }
    .back-btn:hover {
      color: white;
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.05);
    }
    main {
      flex: 1;
      display: flex;
      position: relative;
    }
    #canvas-container {
      flex: 1;
      position: relative;
      background: #060911;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    aside {
      width: 340px;
      background: rgba(15, 23, 42, 0.85);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      overflow-y: auto;
    }
    .panel-title {
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      transition: all 0.15s;
    }
    .btn:hover {
      background: #334155;
      border-color: #38bdf8;
    }
    .btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: white;
    }
    .bt-node {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 6px;
    }
    .bt-node.running { border-color: #f59e0b; background: rgba(245, 158, 11, 0.1); }
    .bt-node.success { border-color: #10b981; background: rgba(16, 185, 129, 0.1); }
    .bt-node.failure { border-color: #ef4444; background: rgba(239, 68, 68, 0.1); }
    .legend {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #94a3b8;
    }
    .legend-box {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }
  </style>

<body>
  <header>
    <div class="brand">
      <h1>Kairo AI Studio</h1>
      <span style="font-size: 11px; color: #64748b;">A* NavMesh Pathfinding & Behavior Tree Engine</span>
    </div>
    <a href="../../index.html" class="back-btn">← Back to Hub</a>
  </header>

  <main>
    <div id="canvas-container">
      <canvas id="ai-canvas"></canvas>
    </div>

    <aside>
      <div>
        <div class="panel-title">Grid Controls</div>
        <div class="control-group">
          <button id="mode-wall" class="btn active">🧱 Mode: Draw Walls</button>
          <button id="mode-start" class="btn">🟢 Mode: Move Start</button>
          <button id="mode-end" class="btn">🎯 Mode: Move Target</button>
          <button id="btn-clear-walls" class="btn" style="margin-top: 4px;">🧹 Clear All Walls</button>
          <button id="btn-step-ai" class="btn" style="border-color: #10b981; color: #34d399;">▶ Run AI Bot Step</button>
        </div>
      </div>

      <div>
        <div class="panel-title">Grid Legend</div>
        <div class="legend">
          <div class="legend-item"><div class="legend-box" style="background: #22c55e;"></div> Start Node</div>
          <div class="legend-item"><div class="legend-box" style="background: #ef4444;"></div> Target Node</div>
          <div class="legend-item"><div class="legend-box" style="background: #334155;"></div> Obstacle Wall</div>
          <div class="legend-item"><div class="legend-box" style="background: #38bdf8;"></div> Calculated Path</div>
        </div>
      </div>

      <div>
        <div class="panel-title">Behavior Tree Live Monitor</div>
        <div id="bt-container">
          <!-- Rendered dynamically -->
        </div>
      </div>
    </aside>
