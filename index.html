<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stickman Quest & Runner - 3D Action Game</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #06080c; font-family: 'Inter', sans-serif; }
    
    #game-canvas { width: 100vw; height: 100vh; display: block; }
    
    /* Sleek Game HUD Overlay */
    #hud-overlay {
      position: absolute;
      top: 16px;
      right: 16px;
      left: 16px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }
    
    .hud-card {
      background: rgba(10, 14, 23, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(99, 102, 241, 0.35);
      border-radius: 12px;
      padding: 10px 16px;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .health-bar-bg {
      width: 120px;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .health-bar-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #10b981, #06b6d4);
      transition: width 0.1s ease;
    }

    /* Touch Controls Overlay */
    #touch-controls {
      position: absolute;
      bottom: 24px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
    }

    .touch-btn {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.85), rgba(79, 70, 229, 0.85));
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      border-radius: 50%;
      width: 68px;
      height: 68px;
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.5);
      cursor: pointer;
      outline: none;
    }

    .touch-btn:active { transform: scale(0.92); }

    .touch-btn-jump {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.9), rgba(5, 150, 105, 0.9));
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.5);
      width: 76px;
      height: 76px;
      font-size: 28px;
    }

    /* Game Over Modal */
    #game-over-modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10, 14, 23, 0.95);
      backdrop-filter: blur(16px);
      border: 2px solid #f43f5e;
      border-radius: 16px;
      padding: 24px 36px;
      text-align: center;
      z-index: 50;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 16px 48px rgba(244, 63, 94, 0.5);
    }

    .restart-btn {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
    }
  </style>
</head>
<body>

  <!-- Fullscreen 3D WebGL Game Canvas -->
  <canvas id="game-canvas"></canvas>

  <!-- Sleek HUD Overlay -->
  <div id="hud-overlay">
    <div class="hud-card">
      <div>
        <div style="font-size: 9px; color: #9ca3af;">SCORE</div>
        <div id="score-val" style="font-size: 18px; font-weight: 900; color: #06b6d4;">0</div>
      </div>
      <div style="border-left: 1px solid rgba(255,255,255,0.15); padding-left: 12px;">
        <div style="font-size: 9px; color: #9ca3af; margin-bottom: 2px;">HEALTH <span id="health-val">100</span>%</div>
        <div class="health-bar-bg">
          <div id="health-fill" class="health-bar-fill"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Touch Mobile Controller Overlay -->
  <div id="touch-controls">
    <div style="display: flex; gap: 14px;">
      <button id="btn-left" class="touch-btn">◀</button>
      <button id="btn-right" class="touch-btn">▶</button>
    </div>
    <button id="btn-jump" class="touch-btn touch-btn-jump">⬆</button>
  </div>

  <!-- Game Over Screen -->
  <div id="game-over-modal">
    <div style="font-size: 24px; font-weight: 900; color: #f43f5e;">GAME OVER</div>
    <div style="font-size: 12px; color: #9ca3af;">Hit a Red Spike Hazard!</div>
    <button class="restart-btn" onclick="resetGame()">🔄 Play Again</button>
  </div>

  <script>
    // --- STANDALONE FULLSCREEN GAME ENGINE ---
    let scene, camera, renderer;
    let playerGroup, coinsList = [], hazardsList = [];
    let score = 0, health = 100, isGameOver = false;
    let playerX = -6, playerY = 0, playerVelY = 0, isGrounded = true;

    const keys = {}, touchState = { left: false, right: false, jump: false };
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // Audio SFX Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSfx(type) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'jump') {
          osc.type = 'sine'; osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(580, now + 0.16);
          gain.gain.setValueAtTime(0.25, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.16);
          osc.start(now); osc.stop(now + 0.16);
        } else if (type === 'coin') {
          osc.type = 'triangle'; osc.frequency.setValueAtTime(880, now);
          osc.frequency.setValueAtTime(1320, now + 0.08);
          gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
          osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'hit') {
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(160, now);
          osc.frequency.linearRampToValueAtTime(60, now + 0.2);
          gain.gain.setValueAtTime(0.35, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
          osc.start(now); osc.stop(now + 0.2);
        }
      } catch(e) {}
    }

    function initGame() {
      const canvas = document.getElementById('game-canvas');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x06080c);
      scene.fog = new THREE.FogExp2(0x06080c, 0.018);

      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(-6, 2.5, 7.5);
      camera.lookAt(-6, 1.8, 0);

      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;

      // Studio Lighting
      scene.add(new THREE.AmbientLight(0xffffff, 0.8));
      const sun = new THREE.DirectionalLight(0xfffaed, 1.5);
      sun.position.set(5, 12, 6); sun.castShadow = true;
      scene.add(sun);
      scene.add(new THREE.PointLight(0x06b6d4, 3.0, 15));

      // Ground Track
      const grid = new THREE.GridHelper(36, 36, 0x6366f1, 0x1e293b);
      scene.add(grid);

      const trackMesh = new THREE.Mesh(new THREE.BoxGeometry(36, 0.2, 6), new THREE.MeshStandardMaterial({ color: 0x151923, roughness: 0.3 }));
      trackMesh.position.set(0, -0.1, 0); trackMesh.receiveShadow = true;
      scene.add(trackMesh);

      // Build 3D Player Character
      playerGroup = createCharacterMesh();
      scene.add(playerGroup);

      // Build Collectibles & Hazards
      spawnGameObjects();

      // Bind Touch Buttons
      bindTouch(document.getElementById('btn-left'), 'left');
      bindTouch(document.getElementById('btn-right'), 'right');
      bindTouch(document.getElementById('btn-jump'), 'jump');

      window.addEventListener('resize', onResize);
      requestAnimationFrame(animate);
    }

    function createCharacterMesh() {
      const group = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x6366f1, roughness: 0.3 });
      const skinMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
      const pantsMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4 });
      const pupilMat = new THREE.MeshBasicMaterial({ color: 0x0f172a });

      // Torso
      const chest = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.19, 0.55, 20), bodyMat); chest.position.set(0, 1.9, 0); chest.castShadow = true; group.add(chest);
      const waist = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.18, 0.4, 20), pantsMat); waist.position.set(0, 1.45, 0); waist.castShadow = true; group.add(waist);

      // Head
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 32, 32), skinMat); head.position.set(0, 2.5, 0); head.castShadow = true; group.add(head);
      const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.04, 16, 16), pupilMat); eyeL.position.set(-0.11, 2.56, 0.3); group.add(eyeL);
      const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.04, 16, 16), pupilMat); eyeR.position.set(0.11, 2.56, 0.3); group.add(eyeR);

      // Limbs
      const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.9, 16), bodyMat); armL.position.set(-0.35, 1.8, 0); armL.rotation.z = 0.2; group.add(armL);
      const armR = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.9, 16), bodyMat); armR.position.set(0.35, 1.8, 0); armR.rotation.z = -0.2; group.add(armR);

      const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.06, 1.0, 16), pantsMat); legL.position.set(-0.16, 0.8, 0); group.add(legL);
      const legR = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.06, 1.0, 16), pantsMat); legR.position.set(0.16, 0.8, 0); group.add(legR);

      group.position.set(playerX, 0, 0);
      return group;
    }

    function spawnGameObjects() {
      // Coins
      const coinMat = new THREE.MeshStandardMaterial({ color: 0x06b6d4, emissive: 0x06b6d4, emissiveIntensity: 0.9 });
      const coinGeom = new THREE.CylinderGeometry(0.3, 0.3, 0.08, 20); coinGeom.rotateX(Math.PI / 2);

      for (let i = 0; i < 8; i++) {
        const coin = new THREE.Mesh(coinGeom, coinMat);
        const cx = -3 + i * 2.2, cy = 1.2 + Math.sin(i * 0.8) * 0.8;
        coin.position.set(cx, cy, 0); coin.castShadow = true; scene.add(coin);
        coinsList.push({ mesh: coin, x: cx, y: cy, active: true });
      }

      // Hazards
      const hazMat = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0xef4444, emissiveIntensity: 0.4 });
      const hazGeom = new THREE.ConeGeometry(0.35, 0.7, 16);

      for (let j = 0; j < 3; j++) {
        const haz = new THREE.Mesh(hazGeom, hazMat);
        const hx = -1.5 + j * 4.5;
        haz.position.set(hx, 0.35, 0); haz.castShadow = true; scene.add(haz);
        hazardsList.push({ mesh: hx, x: hx });
      }
    }

    function bindTouch(el, key) {
      if (!el) return;
      const on = e => { e.preventDefault(); touchState[key] = true; };
      const off = e => { e.preventDefault(); touchState[key] = false; };
      el.addEventListener('touchstart', on); el.addEventListener('touchend', off);
      el.addEventListener('mousedown', on); el.addEventListener('mouseup', off);
    }

    function resetGame() {
      score = 0; health = 100; isGameOver = false; playerX = -6; playerY = 0; playerVelY = 0; isGrounded = true;
      document.getElementById('game-over-modal').style.display = 'none';
      coinsList.forEach(c => { c.active = true; c.mesh.visible = true; });
    }

    let lastTime = 0;
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      if (!isGameOver) {
        // Player Input
        let moveX = 0;
        if (keys['KeyA'] || keys['ArrowLeft'] || touchState.left) moveX -= 1;
        if (keys['KeyD'] || keys['ArrowRight'] || touchState.right) moveX += 1;

        playerX += moveX * 6 * dt;
        playerX = Math.max(-12, Math.min(12, playerX));

        if ((keys['KeyW'] || keys['Space'] || keys['ArrowUp'] || touchState.jump) && isGrounded) {
          playerVelY = 12; isGrounded = false; playSfx('jump');
        }

        // Gravity Physics
        playerVelY -= 28 * dt;
        playerY += playerVelY * dt;
        if (playerY <= 0) { playerY = 0; playerVelY = 0; isGrounded = true; }

        if (playerGroup) playerGroup.position.set(playerX, playerY, 0);

        // Coin Collision
        coinsList.forEach(c => {
          if (c.active) {
            c.mesh.rotation.z += dt * 3;
            if (Math.abs(playerX - c.x) < 0.8 && playerY < 1.2) {
              c.active = false; c.mesh.visible = false; score += 100; playSfx('coin');
            }
          }
        });

        // Hazard Collision
        hazardsList.forEach(h => {
          if (Math.abs(playerX - h.x) < 0.6 && playerY < 0.6) {
            health -= 35 * dt;
            if (health <= 0) { health = 0; isGameOver = true; playSfx('hit'); }
          }
        });

        // Update HUD
        document.getElementById('score-val').innerText = score;
        document.getElementById('health-val').innerText = Math.ceil(health);
        document.getElementById('health-fill').style.width = `${Math.max(0, health)}%`;
        if (isGameOver) document.getElementById('game-over-modal').style.display = 'flex';

        // Camera Track
        camera.position.x += (playerX - camera.position.x) * 0.1;
        camera.lookAt(camera.position.x, 1.8, 0);
      }

      renderer.render(scene, camera);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener('DOMContentLoaded', initGame);
  </script>
</body>
</html>
